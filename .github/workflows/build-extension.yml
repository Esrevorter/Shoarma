# Shoarma CI — builds a ready-to-load Chrome extension zip on every push/PR,
# and publishes it to the Release matching the manifest version tag (vX.Y.Z).
name: build-extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used for tagged releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: ver
        run: |
          V=$(python -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building LLM Bridge v$V"

      - name: Validate manifest + syntax-check sources
        run: |
          python -m json.tool manifest.json > /dev/null
          node --check bridge.js
          node --check swarm-engine.js
          node --check popup.js
          node --check monitor.js
          python -m py_compile orchestrator.py launcher.py scripts/*.py
          echo "✔ all sources valid"

      - name: Package extension (canonical build via tools/build_release.py)
        # v0.9.5: the hand-rolled `zip` command here was the bug — it shipped a
        # legacy file set (no swarm-engine.js, stale background-era files) that
        # Chrome could not load ("Could not load background script ''"). The CI
        # now runs the same validator+builder used locally, which refuses to
        # ship unless every manifest-referenced path exists and no retired
        # files are included.
        run: |
          python3 tools/build_release.py
          ls -la dist/

      - name: Upload artifact (any branch/PR)
        uses: actions/upload-artifact@v4
        with:
          name: shoarma-extension-v${{ steps.ver.outputs.version }}
          path: dist/*.zip

      - name: Attach zip to GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
