<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28" />
    <div>
      <h1>Shoarma</h1>
      <p class="sub">LLM Bridge control deck</p>
    </div>
    <span id="ver" class="ver"></span>
  </header>

  <!-- one click: start the referee, no terminal needed -->
  <section class="card launch">
    <button id="launch" class="big">🚀 Launch swarm</button>
    <p id="launch-hint" class="hint">Starts the orchestrator with your settings below — no terminal required.</p>
    <button id="monitor" class="ghost">📟 Open live monitor</button>
  </section>

  <details class="card" open>
    <summary>Settings <span class="tag">saved automatically</span></summary>

    <label class="field">
      <span>Topic / opening prompt</span>
      <textarea id="topic" rows="3" placeholder="Leave empty for the built-in debate starter…"></textarea>
    </label>

    <div class="grid">
      <label class="field">
        <span>Turns</span>
        <input id="turns" type="number" min="1" max="50" value="6" />
      </label>
      <label class="field">
        <span>Timeout (s)</span>
        <input id="timeout" type="number" min="30" max="600" value="180" />
      </label>
      <label class="field">
        <span>Port</span>
        <input id="port" type="number" min="1024" max="65535" value="8765" />
      </label>
    </div>

    <label class="switch-row">
      <input id="halted" type="checkbox" />
      <span>Halt all agents <em>(kill switch — also Esc in any tab)</em></span>
    </label>

    <button id="push" class="ghost">Apply to open tabs</button>
  </details>

  <section class="card">
    <div id="status" class="status"><span class="dot"></span> scanning tabs…</div>
    <ul id="tabs"></ul>
  </section>

  <footer>
    <a id="install-link" href="#">⬇ Download orchestrator.py</a>
    <span>· read the <a href="https://github.com/Esrevorter/Shoarma/blob/main/README.md" target="_blank">README</a></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
